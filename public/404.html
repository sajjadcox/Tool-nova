<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ToolNova - Loading Tool...</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // If hosted on GitHub Pages in a repository subdirectory (e.g. username.github.io/Tool-nova)
        if (window.location.hostname.endsWith('github.io')) {
          var segments = path.split('/').filter(Boolean);
          if (segments.length > 0) {
            var repo = '/' + segments[0];
            var subPath = segments.slice(1).join('/');
            var target = repo + '/#/' + (subPath ? subPath : '') + search + hash;
            window.location.replace(target);
            return;
          }
        }

        // On Netlify, custom domains, or root deployments
        var cleanPath = path.replace(/^\//, '');
        window.location.replace('/#/' + cleanPath + search + hash);
      })();
    </script>
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 48px; background: #0B1220; color: #F8FAFC;">
    <div style="max-width: 420px; margin: 0 auto; background: #131C31; border: 1px solid #1E293B; border-radius: 16px; padding: 32px;">
      <h2 style="font-size: 20px; font-weight: 700; color: #14B8A6; margin-bottom: 8px;">Loading ToolNova...</h2>
      <p style="color: #94A3B8; font-size: 14px; margin-bottom: 20px;">Redirecting you to the requested tool.</p>
      <a href="./#/" style="display: inline-block; background: #14B8A6; color: #ffffff; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600;">Go to Home</a>
    </div>
  </body>
</html>
